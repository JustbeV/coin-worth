<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ledger &mdash; Crypto Scenario Calculator</title>
<meta name="description" content="Manually enter your crypto holdings and see what they'd be worth under hypothetical prices. No live prices, no accounts, no server.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" class="app">

  <!-- Desktop sidebar -->
  <nav class="sidebar" aria-label="Main navigation">
    <div class="sidebar-brand">
      <span class="brand-mark" aria-hidden="true">Ł</span>
      <span class="brand-name">Ledger</span>
    </div>
    <ul class="sidebar-nav" id="sidebar-nav">
      <li><button class="nav-btn" data-view="portfolio" aria-current="page"><span class="nav-icon" data-icon="portfolio"></span>Portfolio</button></li>
      <li><button class="nav-btn" data-view="scenarios"><span class="nav-icon" data-icon="scenarios"></span>Scenarios</button></li>
      <li><button class="nav-btn" data-view="calculator"><span class="nav-icon" data-icon="calculator"></span>Calculator</button></li>
      <li><button class="nav-btn" data-view="settings"><span class="nav-icon" data-icon="settings"></span>Settings</button></li>
    </ul>
    <div class="sidebar-footer">
      <p>Everything here is stored only in this browser.</p>
    </div>
  </nav>

  <!-- Mobile top bar -->
  <header class="topbar">
    <span class="brand-mark" aria-hidden="true">Ł</span>
    <span class="topbar-title" id="topbar-title">Portfolio</span>
    <button class="icon-btn" id="mobile-settings-btn" aria-label="Settings" data-view="settings">
      <span class="nav-icon" data-icon="settings"></span>
    </button>
  </header>

  <main class="main" id="main" tabindex="-1">
    <!-- Views are rendered here by script.js -->
  </main>

  <!-- Mobile bottom nav -->
  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="bnav-btn" data-view="portfolio" aria-current="page">
      <span class="nav-icon" data-icon="portfolio"></span><span>Portfolio</span>
    </button>
    <button class="bnav-btn" data-view="scenarios">
      <span class="nav-icon" data-icon="scenarios"></span><span>Scenarios</span>
    </button>
    <button class="bnav-btn" data-view="calculator">
      <span class="nav-icon" data-icon="calculator"></span><span>Calculator</span>
    </button>
    <button class="bnav-btn" data-view="settings">
      <span class="nav-icon" data-icon="settings"></span><span>Settings</span>
    </button>
  </nav>
</div>

<!-- Modal root -->
<div id="modal-root"></div>

<!-- Toast container -->
<div id="toast-root" class="toast-root" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
